<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>3D Crest Review — NODIFS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/logo3d.css">
<script type="module" src="js/logo3d.js"></script>
<style>
  body{background:var(--cream)}
  .review-head{padding:48px 0 24px}
  .review-head h1{font-size:clamp(2rem,4vw,3rem)}
  .review-head p{color:var(--muted);max-width:640px}
  .review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding-bottom:64px}
  .stage{position:relative;border-radius:var(--radius);overflow:hidden;min-height:440px;display:grid;place-items:center;box-shadow:var(--shadow)}
  .stage [data-logo3d]{width:min(80%,400px)}
  .stage-label{position:absolute;left:16px;top:14px;z-index:2;font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .on-navy{background:radial-gradient(circle at 50% 40%,#16357f 0%,var(--navy) 70%);color:#ff7b83}
  .on-cream{background:var(--cream);color:var(--red)}
  .on-cream:after{content:"";position:absolute;right:-80px;bottom:-170px;width:360px;height:360px;border-radius:50%;background:#e6394610}
  .on-photo{background:#081331 url(images/School.JPG) center/cover;color:#ff7b83}
  .on-photo:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#081331ed,#081331a0)}
  .on-photo [data-logo3d]{position:relative}
  .wordmark [data-logo3d]{aspect-ratio:4/5;width:min(70%,340px)}
  .review-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
  @media(max-width:820px){.review-grid{grid-template-columns:1fr}.stage{min-height:360px}}
</style>
</head>
<body>
<main class="container">
  <header class="review-head">
    <p class="eyebrow">Review page · not linked from the site</p>
    <h1>3D crest</h1>
    <p>The same floating crest on the backgrounds it will meet on the site. It assembles once per visit, then floats and turns towards the mouse.</p>
    <div class="review-actions">
      <button class="btn btn-red" type="button" id="replay">Replay the animation</button>
      <a class="btn" style="border:1px solid var(--line)" href="index.html">Back to the site</a>
    </div>
  </header>
  <section class="review-grid">
    <div class="stage on-navy"><span class="stage-label">Dark navy</span><div data-logo3d data-intro="always" data-theme="dark"></div></div>
    <div class="stage on-photo"><span class="stage-label">Over the school photo</span><div data-logo3d data-intro="always" data-theme="dark"></div></div>
    <div class="stage on-cream"><span class="stage-label">Cream page hero</span><div data-logo3d data-intro="always"></div></div>
    <div class="stage on-navy wordmark"><span class="stage-label">With wordmark</span><div data-logo3d data-intro="always" data-wordmark data-theme="dark"></div></div>
  </section>
</main>
<script>
  document.querySelector("#replay").addEventListener("click", () =>
    document.querySelectorAll("[data-logo3d]").forEach(el => el.logo3d && el.logo3d.replay()));
</script>
</body>
</html>
